<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Relevamiento de Carrocerías</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#12161A;
    --surface:#1B2127;
    --surface2:#232A31;
    --border:#2E363E;
    --text:#EDEFF2;
    --text-dim:#8C96A1;
    --amber:#E7A33E;
    --amber-dim:#4A3B22;
    --green:#4FA579;
    --green-dim:#20362C;
    --red:#DD6355;
    --red-dim:#3A2320;
    --blue:#6E9BD9;
    --blue-dim:#233245;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  #app{max-width:640px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column; background:var(--bg);}

  .header{
    background:linear-gradient(180deg,#181D22,#12161A);
    border-bottom:1px solid var(--border);
    padding:18px 16px 0 16px;
    position:sticky; top:0; z-index:10;
  }
  .header-top{display:flex; align-items:center; justify-content:space-between; gap:10px;}
  .brand{display:flex; align-items:center; gap:10px;}
  .brand-mark{
    width:38px; height:38px; border-radius:8px;
    background:#F3F1EC;
    display:flex; align-items:center; justify-content:center;
    flex-shrink:0; padding:6px; box-sizing:border-box;
  }
  .brand-mark img{width:100%; height:100%; object-fit:contain; display:block;}
  .brand-text h1{font-family:'Oswald',sans-serif; font-size:16px; letter-spacing:.3px; text-transform:uppercase; font-weight:600;}
  .brand-text p{font-size:11px; color:var(--text-dim); margin-top:1px;}
  .icon-btn{
    background:var(--surface2); border:1px solid var(--border); color:var(--text-dim);
    width:36px; height:36px; border-radius:8px; display:flex; align-items:center; justify-content:center;
    cursor:pointer; font-size:16px; flex-shrink:0;
  }
  .icon-btn:hover{color:var(--text); border-color:#3C4650;}

  .stats-row{display:flex; gap:8px; margin:14px 0 12px 0;}
  .stat-card{
    flex:1; background:var(--surface); border:1px solid var(--border); border-radius:10px;
    padding:9px 10px;
  }
  .stat-num{font-family:'JetBrains Mono',monospace; font-size:20px; font-weight:700; line-height:1;}
  .stat-label{font-size:10px; color:var(--text-dim); text-transform:uppercase; letter-spacing:.5px; margin-top:3px;}
  .stat-card.pend .stat-num{color:var(--amber);}
  .stat-card.done .stat-num{color:var(--green);}

  .tabs{display:flex; gap:4px; border-bottom:1px solid var(--border);}
  .tab{
    flex:1; text-align:center; padding:10px 6px; font-size:13px; font-weight:600;
    color:var(--text-dim); cursor:pointer; border-bottom:2px solid transparent;
    font-family:'Oswald',sans-serif; text-transform:uppercase; letter-spacing:.4px;
  }
  .tab.active{color:var(--amber); border-bottom-color:var(--amber);}

  .content{flex:1; padding:14px 16px 90px 16px; overflow-y:auto;}

  .search-box{
    display:flex; align-items:center; gap:8px; background:var(--surface); border:1px solid var(--border);
    border-radius:9px; padding:9px 12px; margin-bottom:10px;
  }
  .search-box input{
    background:none; border:none; outline:none; color:var(--text); font-size:14px; width:100%;
    font-family:'Inter',sans-serif;
  }
  .search-box input::placeholder{color:var(--text-dim);}
  .search-box .ico{color:var(--text-dim); font-size:14px;}

  .filter-row{display:flex; gap:6px; margin-bottom:12px; flex-wrap:wrap;}
  .filter-group{display:flex; gap:5px; flex-wrap:wrap;}
  .filter-chip{
    font-size:11.5px; padding:6px 11px; border-radius:20px; border:1px solid var(--border);
    color:var(--text-dim); cursor:pointer; background:var(--surface); font-weight:600;
  }
  .filter-chip.on{background:var(--blue-dim); border-color:#3A5678; color:var(--blue);}

  .unit-item{
    display:flex; align-items:center; gap:12px; background:var(--surface); border:1px solid var(--border);
    border-radius:10px; padding:11px 12px; margin-bottom:8px; cursor:pointer; transition:border-color .15s;
  }
  .unit-item:hover{border-color:#3C4650;}
  .unit-chip{
    font-family:'JetBrains Mono',monospace; font-weight:700; font-size:13px;
    background:#0F1114; border:1px solid var(--border); color:var(--amber);
    padding:6px 9px; border-radius:6px; letter-spacing:.5px; flex-shrink:0;
    min-width:74px; text-align:center;
  }
  .unit-item.done .unit-chip{color:var(--green);}
  .unit-meta{flex:1; min-width:0;}
  .unit-meta .m1{font-size:12px; color:var(--text-dim); display:flex; gap:6px; flex-wrap:wrap; align-items:center; margin-bottom:3px;}
  .unit-meta .m2{font-size:11px; color:var(--text-dim);}
  .tag{font-size:10.5px; font-weight:600; padding:2px 7px; border-radius:5px; background:var(--surface2); color:var(--text-dim); border:1px solid var(--border);}
  .score-pill{font-size:10.5px; font-weight:700; padding:2px 8px; border-radius:5px;}
  .score-pill.s1, .score-pill.s2{background:var(--red-dim); color:var(--red);}
  .score-pill.s3{background:var(--amber-dim); color:var(--amber);}
  .score-pill.s4, .score-pill.s5{background:var(--green-dim); color:var(--green);}
  .status-dot{width:8px; height:8px; border-radius:50%; background:var(--amber); flex-shrink:0;}
  .unit-item.done .status-dot{background:var(--green);}
  .chevron{color:var(--text-dim); font-size:16px; flex-shrink:0;}

  .empty-state{text-align:center; padding:50px 20px; color:var(--text-dim);}
  .empty-state .big{font-size:34px; margin-bottom:10px;}
  .empty-state p{font-size:13.5px; line-height:1.5;}

  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:6px;
    background:var(--amber); color:#20180A; border:none; border-radius:9px;
    padding:12px 18px; font-weight:600; font-size:14px; cursor:pointer; font-family:'Inter',sans-serif;
    width:100%;
  }
  .btn:hover{filter:brightness(1.06);}
  .btn.secondary{background:var(--surface2); color:var(--text); border:1px solid var(--border);}
  .btn.danger{background:var(--red-dim); color:var(--red); border:1px solid #5A332E;}
  .btn.small{width:auto; padding:8px 14px; font-size:13px;}
  .btn:disabled{opacity:.5; cursor:not-allowed;}

  .field{margin-bottom:14px;}
  .field label{display:block; font-size:12px; color:var(--text-dim); margin-bottom:6px; text-transform:uppercase; letter-spacing:.4px; font-weight:600;}
  .field input, .field select, .field textarea{
    width:100%; background:var(--surface); border:1px solid var(--border); color:var(--text);
    border-radius:8px; padding:10px 11px; font-size:14px; font-family:'Inter',sans-serif; outline:none;
  }
  .field textarea{resize:vertical; min-height:60px;}
  .field select{appearance:none;}
  .field input:focus, .field select:focus, .field textarea:focus{border-color:var(--amber);}
  .checkbox-row{display:flex; align-items:center; gap:10px; background:var(--green-dim); border:1px solid #2E5240; border-radius:9px; padding:12px; margin-bottom:16px;}
  .checkbox-row input{width:18px; height:18px; accent-color:var(--green);}
  .checkbox-row span{font-size:13.5px; color:var(--text);}

  .score-section{background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:14px; margin-bottom:16px;}
  .score-section label{display:block; font-size:12px; color:var(--text-dim); margin-bottom:10px; text-transform:uppercase; letter-spacing:.4px; font-weight:600;}
  .score-row{display:flex; gap:6px;}
  .score-opt{flex:1; display:flex; flex-direction:column; align-items:center; gap:4px; padding:10px 2px; border-radius:8px; border:1px solid var(--border); cursor:pointer; background:var(--surface2);}
  .score-opt .n{font-family:'JetBrains Mono',monospace; font-weight:700; font-size:16px; color:var(--text-dim);}
  .score-opt .l{font-size:9.5px; color:var(--text-dim); text-align:center; line-height:1.2;}
  .score-opt.on{border-color:currentColor;}
  .score-opt[data-score="1"].on, .score-opt[data-score="2"].on{background:var(--red-dim); color:var(--red);}
  .score-opt[data-score="3"].on{background:var(--amber-dim); color:var(--amber);}
  .score-opt[data-score="4"].on, .score-opt[data-score="5"].on{background:var(--green-dim); color:var(--green);}
  .score-opt.on .n, .score-opt.on .l{color:inherit;}
  input.f-score-hidden{display:none;}

  .desvio-card{background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:13px; margin-bottom:12px; position:relative;}
  .desvio-card .rm{position:absolute; top:10px; right:10px; color:var(--text-dim); cursor:pointer; font-size:14px; background:none; border:none;}
  .desvio-card .rm:hover{color:var(--red);}
  .desvio-num{font-family:'Oswald',sans-serif; font-size:11px; color:var(--text-dim); text-transform:uppercase; letter-spacing:.5px; margin-bottom:10px;}

  .sev-row{display:flex; gap:6px;}
  .sev-opt{flex:1; text-align:center; padding:8px 4px; border-radius:7px; border:1px solid var(--border); font-size:12.5px; cursor:pointer; color:var(--text-dim);}
  .sev-opt.sel-leve.on{background:var(--green-dim); border-color:#2E5240; color:var(--green);}
  .sev-opt.sel-moderado.on{background:var(--amber-dim); border-color:#5A4626; color:var(--amber);}
  .sev-opt.sel-grave.on{background:var(--red-dim); border-color:#5A332E; color:var(--red);}

  .detail-header{display:flex; align-items:center; gap:12px; padding:16px; border-bottom:1px solid var(--border); position:sticky; top:0; background:var(--bg); z-index:5;}
  .back-btn{background:var(--surface2); border:1px solid var(--border); color:var(--text); width:34px; height:34px; border-radius:8px; display:flex; align-items:center; justify-content:center; cursor:pointer; flex-shrink:0;}
  .detail-title-chip{font-family:'JetBrains Mono',monospace; font-weight:700; font-size:16px; color:var(--amber); background:#0F1114; border:1px solid var(--border); padding:6px 12px; border-radius:7px;}
  .detail-sub{font-size:11.5px; color:var(--text-dim); margin-top:4px; display:flex; gap:6px; flex-wrap:wrap;}

  .footer-bar{position:fixed; bottom:0; left:0; right:0; max-width:640px; margin:0 auto; padding:12px 16px; background:linear-gradient(180deg,rgba(18,22,26,0),var(--bg) 30%); }
  .badge{display:inline-block; font-size:10.5px; padding:3px 8px; border-radius:5px; font-weight:600; text-transform:uppercase; letter-spacing:.4px;}
  .badge.leve{background:var(--green-dim); color:var(--green);}
  .badge.moderado{background:var(--amber-dim); color:var(--amber);}
  .badge.grave{background:var(--red-dim); color:var(--red);}

  .setup-wrap{padding:24px 20px; display:flex; flex-direction:column; gap:14px; justify-content:center; min-height:100vh;}
  .setup-wrap h2{font-family:'Oswald',sans-serif; font-size:20px; text-transform:uppercase;}
  .setup-wrap p{font-size:13.5px; color:var(--text-dim); line-height:1.55;}
  .setup-wrap textarea{width:100%; min-height:180px; background:var(--surface); border:1px solid var(--border); color:var(--text); border-radius:9px; padding:12px; font-family:'JetBrains Mono',monospace; font-size:13px; outline:none;}
  .setup-wrap textarea:focus{border-color:var(--amber);}
  .hint{font-size:12px; color:var(--text-dim); background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:10px 12px; line-height:1.5;}
  .hint b{color:var(--text);}
  .error-box{font-size:12px; color:var(--red); background:var(--red-dim); border:1px solid #5A332E; border-radius:8px; padding:10px 12px; line-height:1.5; max-height:120px; overflow-y:auto;}

  .config-section{margin-bottom:22px;}
  .config-section h3{font-family:'Oswald',sans-serif; font-size:13px; text-transform:uppercase; letter-spacing:.4px; color:var(--text-dim); margin-bottom:10px;}
  .toast{
    position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:var(--surface2); border:1px solid var(--border);
    color:var(--text); padding:11px 18px; border-radius:9px; font-size:13px; z-index:100; box-shadow:0 6px 20px rgba(0,0,0,.4); max-width:85%; text-align:center;
  }
  .loading{display:flex; align-items:center; justify-content:center; min-height:60vh; color:var(--text-dim); font-size:13px;}
  .summary-block{background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:13px; margin-bottom:10px;}
  .summary-block .row1{display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;}
  .summary-block .obs{font-size:13px; color:var(--text-dim); margin-top:6px; line-height:1.4;}
  .meta-line{font-size:12px; color:var(--text-dim); margin-bottom:8px; line-height:1.6;}
  .meta-line b{color:var(--text);}
  .score-display{display:inline-flex; align-items:center; gap:6px; padding:6px 12px; border-radius:8px; font-weight:700; font-size:14px; margin-bottom:14px;}
  textarea#add-textarea{width:100%; min-height:100px; background:var(--surface); border:1px solid var(--border); color:var(--text); border-radius:8px; padding:10px; font-family:'JetBrains Mono',monospace; font-size:13px; outline:none; margin-bottom:10px;}
</style>
</head>
<body>
<div id="app"><div class="loading">Cargando…</div></div>

<div id="security-modal-overlay" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,.65); z-index:200; align-items:center; justify-content:center; padding:20px;">
  <div style="background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:20px; max-width:340px; width:100%;">
    <div style="font-size:14px; color:var(--text); margin-bottom:14px; line-height:1.5;" id="security-modal-message"></div>
    <input type="password" id="security-modal-input" inputmode="numeric" autocomplete="off" placeholder="Código de seguridad" style="width:100%; background:var(--surface2); border:1px solid var(--border); color:var(--text); border-radius:8px; padding:11px 12px; font-size:16px; margin-bottom:8px; outline:none; letter-spacing:3px; font-family:'JetBrains Mono',monospace;">
    <div id="security-modal-error" style="display:none; color:var(--red); font-size:12px; margin-bottom:10px;">Código incorrecto. Probá de nuevo.</div>
    <div style="display:flex; gap:8px; margin-top:6px;">
      <button id="security-modal-cancel" class="btn secondary" style="flex:1;">Cancelar</button>
      <button id="security-modal-confirm" class="btn danger" style="flex:1;">Confirmar</button>
    </div>
  </div>
</div>

<div id="lightbox-overlay" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,.92); z-index:250; align-items:center; justify-content:center; padding:0; overflow:hidden; touch-action:none;">
  <button id="lightbox-close" style="position:absolute; top:16px; right:16px; background:var(--surface2); border:1px solid var(--border); color:var(--text); width:38px; height:38px; border-radius:8px; font-size:18px; cursor:pointer; z-index:3;">✕</button>
  <div id="lightbox-counter" style="position:absolute; top:22px; left:16px; color:var(--text-dim); font-size:13px; font-family:'JetBrains Mono',monospace; z-index:3;"></div>
  <button id="lightbox-prev" style="display:none; position:absolute; left:2px; top:50%; transform:translateY(-50%); background:none; border:none; color:var(--text); opacity:.75; width:34px; height:56px; font-size:26px; cursor:pointer; z-index:2; text-shadow:0 1px 5px rgba(0,0,0,.8);">‹</button>
  <div id="lightbox-img-wrap" style="width:100%; height:100%; display:flex; align-items:center; justify-content:center; overflow:hidden;">
    <img id="lightbox-img" src="" style="max-width:94vw; max-height:88vh; object-fit:contain; border-radius:4px; touch-action:none; user-select:none; will-change:transform;">
  </div>
  <button id="lightbox-next" style="display:none; position:absolute; right:2px; top:50%; transform:translateY(-50%); background:none; border:none; color:var(--text); opacity:.75; width:34px; height:56px; font-size:26px; cursor:pointer; z-index:2; text-shadow:0 1px 5px rgba(0,0,0,.8);">›</button>
  <div id="lightbox-info" style="display:none; position:absolute; bottom:0; left:0; right:0; background:linear-gradient(180deg, rgba(18,22,26,0), rgba(18,22,26,.97) 30%); padding:26px 20px 18px 20px; z-index:2;"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-storage-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyBucGehaAyYusww2jGNCzC62Kae0yI6I4s",
  authDomain: "relevamiento-carroceria.firebaseapp.com",
  projectId: "relevamiento-carroceria",
  storageBucket: "relevamiento-carroceria.firebasestorage.app",
  messagingSenderId: "429221920128",
  appId: "1:429221920128:web:5b44ad9ad0a3e5fd7fd565"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const storage = firebase.storage();

function photoUrl(p){
  if(!p) return '';
  return (typeof p === 'string') ? p : (p.url || '');
}
function dataURLtoBlob(dataUrl){
  const arr = dataUrl.split(',');
  const mime = arr[0].match(/:(.*?);/)[1];
  const bstr = atob(arr[1]);
  let n = bstr.length;
  const u8arr = new Uint8Array(n);
  while(n--){ u8arr[n] = bstr.charCodeAt(n); }
  return new Blob([u8arr], { type: mime });
}
async function uploadPhoto(dataUrl, unitId){
  const blob = dataURLtoBlob(dataUrl);
  const path = `fotos/${unitId}/${Date.now()}_${Math.random().toString(36).slice(2,8)}.jpg`;
  const ref = storage.ref().child(path);
  await ref.put(blob);
  const url = await ref.getDownloadURL();
  return { url, path };
}
async function deletePhotoFile(path){
  if(!path) return;
  try{ await storage.ref().child(path).delete(); }catch(e){ console.error(e); }
}

async function dbGetMaster(){
  const doc = await db.collection('app').doc('config').get();
  return doc.exists ? (doc.data().masterList || []) : null;
}
async function dbSetMaster(list){
  await db.collection('app').doc('config').set({ masterList: list });
}
async function dbListUnitIds(){
  const snap = await db.collection('units').get();
  return snap.docs.map(d => d.id);
}
async function dbGetUnit(id){
  const doc = await db.collection('units').doc(id).get();
  return doc.exists ? doc.data() : null;
}
async function dbSetUnit(id, record){
  await db.collection('units').doc(id).set(record);
}
async function dbDeleteUnit(id){
  await db.collection('units').doc(id).delete();
}

function sanitizeId(raw){
  return raw.trim().replace(/[\/\\'"]+/g,'-').replace(/\s+/g,'-');
}
function matchTaller(raw){
  const r = raw.trim().toUpperCase();
  return TALLERES.find(t => t.toUpperCase() === r) || null;
}
function matchLinea(raw){
  const r = raw.trim().toLowerCase();
  return LINEAS.find(l => l.toLowerCase() === r) || null;
}
function validAnio(raw){
  const n = parseInt(raw.trim(), 10);
  if(isNaN(n)) return null;
  if(n < 1980 || n > 2035) return null;
  return String(n);
}

function parseMasterInput(text){
  const lines = text.split('\n').map(l=>l.trim()).filter(Boolean);
  const valid = [];
  const errors = [];
  lines.forEach((line, idx) => {
    const parts = line.split(/[,;\t]/).map(p=>p.trim()).filter(Boolean);
    if(parts.length < 5){
      errors.push(`Línea ${idx+1}: "${line}" — faltan datos (se esperan ID, taller, línea, año modelo, modelo)`);
      return;
    }
    const id = sanitizeId(parts[0]);
    const taller = matchTaller(parts[1]);
    const linea = matchLinea(parts[2]);
    const anio = validAnio(parts[3]);
    const modelo = parts[4];
    if(!id){ errors.push(`Línea ${idx+1}: ID vacío`); return; }
    if(!taller){ errors.push(`Línea ${idx+1}: taller "${parts[1]}" no reconocido (usar ${TALLERES.join('/')})`); return; }
    if(!linea){ errors.push(`Línea ${idx+1}: línea "${parts[2]}" no reconocida (usar ${LINEAS.join(' / ')})`); return; }
    if(!anio){ errors.push(`Línea ${idx+1}: año modelo "${parts[3]}" inválido`); return; }
    if(!modelo){ errors.push(`Línea ${idx+1}: falta el modelo`); return; }
    valid.push({id, taller, linea, anio, modelo});
  });
  return {valid, errors};
}

let lightboxPhotos = [];
let lightboxIndex = 0;
let lbScale = 1, lbTx = 0, lbTy = 0;

function resetZoom(){
  lbScale = 1; lbTx = 0; lbTy = 0;
  applyZoomTransform(false);
}
function applyZoomTransform(animated){
  const img = document.getElementById('lightbox-img');
  img.style.transition = animated ? 'transform .15s ease-out' : 'none';
  img.style.transform = `translate(${lbTx}px, ${lbTy}px) scale(${lbScale})`;
}

function openLightbox(entries, idx){
  if(!entries || entries.length === 0) return;
  lightboxPhotos = entries;
  lightboxIndex = idx;
  renderLightbox();
  document.getElementById('lightbox-overlay').style.display = 'flex';
}
function renderLightbox(){
  resetZoom();
  const entry = lightboxPhotos[lightboxIndex];
  const img = document.getElementById('lightbox-img');
  img.src = entry.url;
  document.getElementById('lightbox-counter').textContent = lightboxPhotos.length > 1 ? `${lightboxIndex+1} / ${lightboxPhotos.length}` : '';
  const multi = lightboxPhotos.length > 1;
  document.getElementById('lightbox-prev').style.display = multi ? 'flex' : 'none';
  document.getElementById('lightbox-next').style.display = multi ? 'flex' : 'none';

  const infoBox = document.getElementById('lightbox-info');
  if(entry.info && (entry.info.zona || entry.info.tipo || entry.info.observaciones)){
    const sevClass = (entry.info.severidad||'').toLowerCase();
    infoBox.innerHTML = `
      <div style="display:flex; justify-content:space-between; align-items:center; gap:8px; margin-bottom:4px;">
        <b style="font-size:13.5px; color:var(--text);">${escapeHtml(entry.info.zona||'—')}</b>
        ${entry.info.severidad ? `<span class="badge ${sevClass}">${escapeHtml(entry.info.severidad)}</span>` : ''}
      </div>
      <div style="font-size:12.5px; color:var(--text-dim);">${escapeHtml(entry.info.tipo||'')}</div>
      ${entry.info.observaciones ? `<div style="font-size:12px; color:var(--text-dim); margin-top:4px;">${escapeHtml(entry.info.observaciones)}</div>` : ''}
    `;
    infoBox.style.display = 'block';
    img.style.maxHeight = '68vh';
  } else {
    infoBox.style.display = 'none';
    img.style.maxHeight = '88vh';
  }
}
function closeLightbox(){
  document.getElementById('lightbox-overlay').style.display = 'none';
  resetZoom();
}
function initLightbox(){
  const overlay = document.getElementById('lightbox-overlay');
  const img = document.getElementById('lightbox-img');
  document.getElementById('lightbox-close').onclick = closeLightbox;
  document.getElementById('lightbox-prev').onclick = () => {
    lightboxIndex = (lightboxIndex - 1 + lightboxPhotos.length) % lightboxPhotos.length;
    renderLightbox();
  };
  document.getElementById('lightbox-next').onclick = () => {
    lightboxIndex = (lightboxIndex + 1) % lightboxPhotos.length;
    renderLightbox();
  };
  overlay.addEventListener('click', (e) => { if(e.target === overlay) closeLightbox(); });
  document.addEventListener('keydown', (e) => {
    if(overlay.style.display !== 'flex') return;
    if(e.key === 'Escape') closeLightbox();
    if(e.key === 'ArrowLeft') document.getElementById('lightbox-prev').click();
    if(e.key === 'ArrowRight') document.getElementById('lightbox-next').click();
  });

  // --- Zoom con pellizco (pinch), arrastre (pan) y deslizar (swipe) para navegar ---
  const MAX_ZOOM = 4;
  let pinchStartDist = null, pinchStartScale = 1, isPinching = false;
  let panStart = null;
  let swipeStartX = null, swipeStartY = null, swipeStartTime = 0;
  let lastTapTime = 0;

  function touchDist(t1, t2){ return Math.hypot(t1.clientX - t2.clientX, t1.clientY - t2.clientY); }

  img.addEventListener('touchstart', (e) => {
    if(e.touches.length === 2){
      isPinching = true;
      pinchStartDist = touchDist(e.touches[0], e.touches[1]);
      pinchStartScale = lbScale;
    } else if(e.touches.length === 1){
      if(lbScale > 1.01){
        panStart = { x:e.touches[0].clientX, y:e.touches[0].clientY, tx:lbTx, ty:lbTy };
      } else {
        swipeStartX = e.touches[0].clientX;
        swipeStartY = e.touches[0].clientY;
        swipeStartTime = Date.now();
      }
    }
  }, {passive:true});

  img.addEventListener('touchmove', (e) => {
    if(e.touches.length === 2 && isPinching){
      e.preventDefault();
      const newDist = touchDist(e.touches[0], e.touches[1]);
      lbScale = Math.max(1, Math.min(MAX_ZOOM, pinchStartScale * (newDist / pinchStartDist)));
      applyZoomTransform(false);
    } else if(e.touches.length === 1 && panStart){
      e.preventDefault();
      lbTx = panStart.tx + (e.touches[0].clientX - panStart.x);
      lbTy = panStart.ty + (e.touches[0].clientY - panStart.y);
      applyZoomTransform(false);
    }
  }, {passive:false});

  img.addEventListener('touchend', (e) => {
    if(e.touches.length === 0){
      if(isPinching){
        isPinching = false;
        if(lbScale <= 1.02) resetZoom();
      } else if(panStart){
        panStart = null;
        if(lbScale <= 1.02) resetZoom();
      } else if(swipeStartX !== null){
        const touch = e.changedTouches[0];
        const dx = touch.clientX - swipeStartX;
        const dy = touch.clientY - swipeStartY;
        const dt = Date.now() - swipeStartTime;
        if(lightboxPhotos.length > 1 && Math.abs(dx) > 55 && Math.abs(dx) > Math.abs(dy) * 1.4 && dt < 600){
          if(dx < 0) document.getElementById('lightbox-next').click();
          else document.getElementById('lightbox-prev').click();
        }
      }
      swipeStartX = null; swipeStartY = null;

      const now = Date.now();
      if(now - lastTapTime < 300){
        if(lbScale > 1.01){ resetZoom(); }
        else { lbScale = 2.4; applyZoomTransform(true); }
      }
      lastTapTime = now;
    } else if(e.touches.length === 1 && isPinching){
      isPinching = false;
      if(lbScale > 1.01){
        panStart = { x:e.touches[0].clientX, y:e.touches[0].clientY, tx:lbTx, ty:lbTy };
      } else {
        resetZoom();
      }
    }
  }, {passive:true});

  // Doble click en desktop para hacer zoom
  img.addEventListener('dblclick', () => {
    if(lbScale > 1.01){ resetZoom(); }
    else { lbScale = 2.4; applyZoomTransform(true); }
  });
}

function initSecurityModal(){
  const overlay = document.getElementById('security-modal-overlay');
  const input = document.getElementById('security-modal-input');
  const confirmBtn = document.getElementById('security-modal-confirm');
  const cancelBtn = document.getElementById('security-modal-cancel');

  confirmBtn.onclick = () => {

      closeSecurityModal(true);
    } else {

      input.value = '';
      input.focus();

function toast(msg){
  const t = document.createElement('div');
  t.className = 'toast';
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(()=>t.remove(), 3200);
}

function buildUnitsById(){
  state.unitsById = {};
  state.masterList.forEach(u => { state.unitsById[u.id] = u; });
}

async function loadAll(){
  try{
    let masterList = null;
    try{ masterList = await dbGetMaster(); }catch(e){ masterList = null; console.error(e); }
    if(masterList === null){
      state.screen = 'setup';
      render();
      return;
    }
    state.masterList = masterList;
    buildUnitsById();

    let ids = [];
    try{ ids = await dbListUnitIds(); }catch(e){ ids = []; }
    state.completedSet = new Set(ids);
    state.recordsCache = {};

    try{ state.lastUser = localStorage.getItem('relevamiento-last-user') || ''; }catch(e){ state.lastUser = ''; }

    state.screen = 'dashboard';
    render();
  }catch(err){
    console.error(err);
    app.innerHTML = `<div class="loading">Error cargando datos. <br><br><button class="btn small" onclick="loadAll()">Reintentar</button></div>`;
  }
}

async function ensureRecordsLoaded(ids){
  const missing = ids.filter(id => !(id in state.recordsCache));
  if(missing.length === 0) return;
  await Promise.all(missing.map(async id => {
    try{
      state.recordsCache[id] = await dbGetUnit(id);
    }catch(e){ state.recordsCache[id] = null; }
  }));
}

  return true;
}

}

function compressImage(file, maxDim=800, quality=0.5){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = (e)=>{
      const img = new Image();
      img.onload = ()=>{
        let w = img.width, h = img.height;
        if(w >= h){ if(w > maxDim){ h = Math.round(h * maxDim / w); w = maxDim; } }
        else { if(h > maxDim){ w = Math.round(w * maxDim / h); h = maxDim; } }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = () => reject(new Error('No se pudo leer la imagen'));
      img.src = e.target.result;
    };
    reader.onerror = () => reject(new Error('No se pudo leer el archivo'));
    reader.readAsDataURL(file);
  });
}

async function handlePhotoFiles(e){
  const rawFiles = Array.from(e.target.files || []);
  if(rawFiles.length === 0) return;
  const files = rawFiles.filter(f => f.type && f.type.startsWith('image/'));
  if(files.length < rawFiles.length){
    toast(`${rawFiles.length - files.length} archivo(s) ignorado(s) por no ser imágenes.`);
  }
  if(files.length === 0){ e.target.value = ''; return; }
  const remaining = MAX_PHOTOS - getTotalPhotoCount();
  if(remaining <= 0){ toast(`Máximo ${MAX_PHOTOS} fotos en total (generales + desvíos) por unidad.`); e.target.value=''; return; }
  const toProcess = files.slice(0, remaining);
  if(files.length > toProcess.length){ toast(`Solo se procesan ${toProcess.length} (quedaban ${remaining} lugares disponibles de ${MAX_PHOTOS} en total).`); }
  const unitId = state.detailId;
  toast('Subiendo foto(s)…');
  for(const f of toProcess){
    try{
      const dataUrl = await compressImage(f, 1280, 0.70);
      const uploaded = await uploadPhoto(dataUrl, unitId);
      newlyUploadedPaths.add(uploaded.path);
      currentPhotos.push(uploaded);
      const grid = document.getElementById('photos-grid');
      if(grid) grid.innerHTML = photosGridHtml();
    }catch(err){ console.error(err); toast('Una foto no se pudo subir. Revisá la conexión.'); }
  }
  e.target.value = '';
}

function desvioPhotoSlotHtml(foto){
  if(foto && photoUrl(foto)){
    return `
      <div style="position:relative; width:74px; height:74px;">
        <img class="desvio-foto-img" src="${photoUrl(foto)}" style="width:100%; height:100%; object-fit:cover; border-radius:8px; border:1px solid var(--border); display:block; cursor:pointer;">
        <button type="button" class="rm-desvio-foto" style="position:absolute; top:-6px; right:-6px; background:var(--red-dim); color:var(--red); border:1px solid #5A332E; border-radius:50%; width:20px; height:20px; font-size:11px; cursor:pointer; line-height:1;">✕</button>
        <input type="hidden" class="f-foto-url" value="${photoUrl(foto)}">
        <input type="hidden" class="f-foto-path" value="${foto.path||''}">
      </div>
    `;
  }
  return `
    <div style="display:flex; gap:6px;">
      <button type="button" class="foto-cam-btn btn secondary small">📷</button>
      <button type="button" class="foto-gal-btn btn secondary small">🖼️</button>
      <input type="file" class="f-foto-input-camera" accept="image/*" capture="environment" style="display:none;">
      <input type="file" class="f-foto-input-gallery" accept="image/*" style="display:none;">
      <input type="hidden" class="f-foto-url" value="">
      <input type="hidden" class="f-foto-path" value="">
    </div>
  `;
}

function desvioCardHtml(i, d){
  d = d || {zona:'', tipo:'', severidad:'', observaciones:'', foto:null};
  return `
    <div class="desvio-card">
      <button type="button" class="rm" data-action="rm-desvio">✕</button>
      <div class="desvio-num">Desvío ${i+1}</div>
      <div class="field">
        <label>Zona</label>
        <select class="f-zona">
          <option value="">Seleccionar…</option>
          ${ZONAS.map(z => `<option value="${escapeHtml(z)}" ${d.zona===z?'selected':''}>${escapeHtml(z)}</option>`).join('')}
        </select>
      </div>
      <div class="field">
        <label>Tipo de desvío</label>
        <select class="f-tipo">
          <option value="">Seleccionar…</option>
          ${TIPOS.map(t => `<option value="${escapeHtml(t)}" ${d.tipo===t?'selected':''}>${escapeHtml(t)}</option>`).join('')}
        </select>
      </div>
      <div class="field">
        <label>Severidad</label>
        <div class="sev-row">
          <div class="sev-opt sel-leve ${d.severidad==='Leve'?'on':''}" data-sev="Leve">Leve</div>
          <div class="sev-opt sel-moderado ${d.severidad==='Moderado'?'on':''}" data-sev="Moderado">Moderado</div>
          <div class="sev-opt sel-grave ${d.severidad==='Grave'?'on':''}" data-sev="Grave">Grave</div>
        </div>
        <input type="hidden" class="f-severidad" value="${escapeHtml(d.severidad||'')}">
      </div>
      <div class="field">
        <label>Foto del desvío (opcional, máx. 1)</label>
        <div class="desvio-photo-wrap">${desvioPhotoSlotHtml(d.foto)}</div>
      </div>
      <div class="field" style="margin-bottom:0;">
        <label>Observaciones</label>
        <textarea class="f-obs" placeholder="Detalle adicional (opcional)">${escapeHtml(d.observaciones||'')}</textarea>
      </div>
    </div>
  `;
}

function attachFormHandlers(){
  const fotoInputCamera = document.getElementById('foto-input-camera');
  if(fotoInputCamera){ fotoInputCamera.onchange = handlePhotoFiles; }
  const fotoInputGallery = document.getElementById('foto-input-gallery');
  if(fotoInputGallery){ fotoInputGallery.onchange = handlePhotoFiles; }

  const scoreOpts = document.querySelectorAll('.score-opt');
  scoreOpts.forEach(opt => {
    opt.onclick = () => {
      scoreOpts.forEach(o => o.classList.remove('on'));
      opt.classList.add('on');
      document.getElementById('f-puntaje').value = opt.dataset.score;
    };
  });

  const noDesv = document.getElementById('no-desvios');
  const list = document.getElementById('desvios-list');
  const addBtn = document.getElementById('add-desvio-btn');

  if(noDesv){
    noDesv.addEventListener('change', ()=>{
      if(noDesv.checked){ list.style.display='none'; addBtn.style.display='none'; }
      else { list.style.display=''; addBtn.style.display=''; if(list.children.length===0){ list.insertAdjacentHTML('beforeend', desvioCardHtml(0,null)); bindCard(list.lastElementChild); } }
    });
  }
  Array.from(document.querySelectorAll('.desvio-card')).forEach(bindCard);

  if(addBtn){
    addBtn.onclick = ()=>{
      const idx = list.children.length;
      list.insertAdjacentHTML('beforeend', desvioCardHtml(idx, null));
      bindCard(list.lastElementChild);
    };
  }

  const submitBtn = document.getElementById('submit-btn');
  if(submitBtn){
    submitBtn.onclick = submitForm;
  }
}

function bindCard(card){
  const rm = card.querySelector('[data-action="rm-desvio"]');
  rm.onclick = ()=>{
    const path = card.querySelector('.f-foto-path')?.value;
    if(path){
      if(newlyUploadedPaths.has(path)){ deletePhotoFile(path); newlyUploadedPaths.delete(path); }
      else { pendingDeletePaths.push(path); }
    }
    card.remove();
  };
  Array.from(card.querySelectorAll('.sev-opt')).forEach(opt=>{
    opt.onclick = ()=>{
      Array.from(card.querySelectorAll('.sev-opt')).forEach(o=>o.classList.remove('on'));
      opt.classList.add('on');
      card.querySelector('.f-severidad').value = opt.dataset.sev;
    };
  });
  bindDesvioPhotoSlot(card);
}

function bindDesvioPhotoSlot(card){
  const wrap = card.querySelector('.desvio-photo-wrap');
  if(!wrap) return;
  const rmBtn = wrap.querySelector('.rm-desvio-foto');
  const img = wrap.querySelector('.desvio-foto-img');
  const camBtn = wrap.querySelector('.foto-cam-btn');
  const galBtn = wrap.querySelector('.foto-gal-btn');
  const camInput = wrap.querySelector('.f-foto-input-camera');
  const galInput = wrap.querySelector('.f-foto-input-gallery');

  if(img){
    img.onclick = () => {
      const url = wrap.querySelector('.f-foto-url').value;
      if(!url) return;
      const entries = buildCombinedPhotoEntriesForm();
      const startIdx = Math.max(0, entries.findIndex(en => en.url === url));
      openLightbox(entries, startIdx);
    };
  }
  if(rmBtn){
    rmBtn.onclick = () => {
      const path = wrap.querySelector('.f-foto-path').value;
      if(path){
        if(newlyUploadedPaths.has(path)){ deletePhotoFile(path); newlyUploadedPaths.delete(path); }
        else { pendingDeletePaths.push(path); }
      }
      wrap.innerHTML = desvioPhotoSlotHtml(null);
      bindDesvioPhotoSlot(card);
    };
  }
  async function handleFile(file){
    if(!file) return;
    if(!file.type || !file.type.startsWith('image/')){ toast('Solo se permiten archivos de imagen.'); return; }
    if(getTotalPhotoCount() >= MAX_PHOTOS){ toast(`Máximo ${MAX_PHOTOS} fotos en total (generales + desvíos) por unidad.`); return; }
    toast('Subiendo foto…');
    try{
      const dataUrl = await compressImage(file, 1280, 0.70);
      const uploaded = await uploadPhoto(dataUrl, state.detailId);
      newlyUploadedPaths.add(uploaded.path);
      wrap.innerHTML = desvioPhotoSlotHtml(uploaded);
      bindDesvioPhotoSlot(card);
    }catch(err){ console.error(err); toast('No se pudo subir la foto.'); }
  }
  if(camBtn) camBtn.onclick = () => camInput.click();
  if(galBtn) galBtn.onclick = () => galInput.click();
  if(camInput) camInput.onchange = (e) => { const f = e.target.files[0]; e.target.value=''; handleFile(f); };
  if(galInput) galInput.onchange = (e) => { const f = e.target.files[0]; e.target.value=''; handleFile(f); };
}

function buildCombinedPhotoEntriesForm(){
  const entries = currentPhotos.map(p => ({ url: photoUrl(p), info: null }));
  document.querySelectorAll('.desvio-card').forEach(card => {
    const url = card.querySelector('.f-foto-url')?.value;
    if(url){
      entries.push({
        url,
        info: {
          zona: card.querySelector('.f-zona').value,
          tipo: card.querySelector('.f-tipo').value,
          severidad: card.querySelector('.f-severidad').value,
          observaciones: card.querySelector('.f-obs').value
        }
      });
    }
  });
  return entries;
}
function buildCombinedPhotoEntriesRecord(rec){
  const entries = (rec.fotos||[]).map(p => ({ url: photoUrl(p), info: null }));
  (rec.desvios||[]).forEach(d => {
    if(d.foto && photoUrl(d.foto)){
      entries.push({ url: photoUrl(d.foto), info: { zona:d.zona, tipo:d.tipo, severidad:d.severidad, observaciones:d.observaciones } });
    }
  });
  return entries;
}

async function submitForm(){
  const id = state.detailId;
  const puntaje = parseInt(document.getElementById('f-puntaje').value, 10);
  if(!puntaje){ toast('Elegí un puntaje general para la carrocería.'); return; }
  const noDesv = document.getElementById('no-desvios').checked;
  const usuario = document.getElementById('usuario-input').value.trim();
  if(!usuario){ toast('Ingresá quién releva la unidad.'); return; }

  let desvios = [];
  if(!noDesv){
    const cards = Array.from(document.querySelectorAll('.desvio-card'));
    if(cards.length === 0){ toast('Agregá al menos un desvío, o marcá "No se detectaron desvíos".'); return; }
    for(const c of cards){
      const zona = c.querySelector('.f-zona').value;
      const tipo = c.querySelector('.f-tipo').value;
      const sev = c.querySelector('.f-severidad').value;
      const obs = c.querySelector('.f-obs').value.trim();
      if(!zona || !tipo || !sev){ toast('Completá zona, tipo y severidad en todos los desvíos.'); return; }
      const fotoUrl_ = c.querySelector('.f-foto-url').value;
      const fotoPath_ = c.querySelector('.f-foto-path').value;
      const foto = fotoUrl_ ? { url: fotoUrl_, path: fotoPath_ } : null;
      desvios.push({zona, tipo, severidad:sev, observaciones:obs, foto});
    }
  }

  const record = { usuario, fecha: new Date().toISOString(), puntaje, desvios, fotos: currentPhotos.slice() };
  const btn = document.getElementById('submit-btn');
  btn.disabled = true; btn.textContent = 'Guardando…';
  try{
    await dbSetUnit(id, record);
    for(const p of pendingDeletePaths){ deletePhotoFile(p); }
    pendingDeletePaths = [];
    newlyUploadedPaths = new Set();
    try{ localStorage.setItem('relevamiento-last-user', usuario); }catch(e){}
    state.completedSet.add(id);
    state.recordsCache[id] = record;
    state.lastUser = usuario;
    toast('Relevamiento guardado ✓');
    state.screen = 'dashboard';
    state.tab = 'pending';
    render();
  }catch(e){
    console.error(e);
    toast('Error al guardar. Probá de nuevo.');
    btn.disabled = false; btn.textContent = 'Guardar relevamiento';
  }
}

async function openUnit(id){
  state.detailId = id;
  state.detailRecord = null;
  if(state.completedSet.has(id)){
    try{
      if(id in state.recordsCache && state.recordsCache[id]){
        state.detailRecord = state.recordsCache[id];
      } else {
        state.detailRecord = await dbGetUnit(id);
        state.recordsCache[id] = state.detailRecord;
      }
    }catch(e){ state.detailRecord = null; }
  }
  state.screen = 'detail';
  render();
}

async function exportCSV(){
  toast('Preparando CSV…');
  const units = getDoneUnits();
  let rows = [['unidad','taller','linea','anio_modelo','modelo','puntaje','usuario','fecha','zona','tipo_desvio','severidad','observaciones','foto_desvio_url']];
  for(const u of units){
    try{
      const rec = await dbGetUnit(u.id);
      if(!rec) continue;
      if(!rec.desvios || rec.desvios.length===0){
        rows.push([u.id, u.taller, u.linea, u.anio, u.modelo, rec.puntaje||'', rec.usuario, rec.fecha, '', 'SIN DESVIOS', '', '', '']);
      } else {
        rec.desvios.forEach(d=>{
          rows.push([u.id, u.taller, u.linea, u.anio, u.modelo, rec.puntaje||'', rec.usuario, rec.fecha, d.zona, d.tipo, d.severidad, (d.observaciones||'').replace(/\n/g,' '), photoUrl(d.foto)]);
        });
      }
    }catch(e){}
  }
  const csv = rows.map(r => r.map(cell => `"${String(cell).replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `relevamiento-carrocerias-${new Date().toISOString().slice(0,10)}.csv`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
  toast('CSV descargado ✓');
}

function escapeHtml(str){
  return String(str||'').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function formatDate(iso){
  try{
    const d = new Date(iso);
    const tz = 'America/Argentina/Buenos_Aires';
    return d.toLocaleDateString('es-AR', {day:'2-digit',month:'2-digit',year:'numeric', timeZone:tz}) + ' ' + d.toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit', timeZone:tz}) + ' (GMT-3)';
  }catch(e){ return iso; }
}
function formatDateShort(iso){
  try{
    const d = new Date(iso);
    return d.toLocaleDateString('es-AR', {day:'2-digit',month:'2-digit',year:'2-digit', timeZone:'America/Argentina/Buenos_Aires'});
  }catch(e){ return iso; }
}

document.addEventListener('click', async (e)=>{
  const el = e.target.closest('[data-action]');
  if(!el) return;
  const action = el.dataset.action;

  if(action === 'tab'){ state.tab = el.dataset.tab; state.search=''; render(); }
  else if(action === 'open'){ openUnit(el.dataset.id); }
  else if(action === 'back'){
    if(newlyUploadedPaths && newlyUploadedPaths.size){
      newlyUploadedPaths.forEach(p => deletePhotoFile(p));
      newlyUploadedPaths = new Set();
    }
    pendingDeletePaths = [];
    state.screen='dashboard'; render();
  }
  else if(action === 'refresh'){ app.innerHTML = '<div class="loading">Actualizando…</div>'; await loadAll(); }
  else if(action === 'export'){ exportCSV(); }
  else if(action === 'filter-taller'){ state.filterTaller = el.dataset.val; render(); }
  else if(action === 'filter-linea'){ state.filterLinea = el.dataset.val; render(); }
  else if(action === 'add-photo-camera'){
    const fi = document.getElementById('foto-input-camera');
    if(fi) fi.click();
  }
  else if(action === 'add-photo-gallery'){
    const fi = document.getElementById('foto-input-gallery');
    if(fi) fi.click();
  }
  else if(action === 'rm-photo'){
    const idx = parseInt(el.dataset.idx, 10);
    const removed = currentPhotos.splice(idx, 1)[0];
    const grid = document.getElementById('photos-grid');
    if(grid) grid.innerHTML = photosGridHtml();
    if(removed && typeof removed === 'object' && removed.path){
      if(newlyUploadedPaths.has(removed.path)){
        deletePhotoFile(removed.path);
        newlyUploadedPaths.delete(removed.path);
      } else {
        pendingDeletePaths.push(removed.path);
      }
    }
  }
  else if(action === 'view-photo'){
    const idx = parseInt(el.dataset.idx, 10);
    const source = el.dataset.source;
    let entries, targetUrl;
    if(source === 'current'){
      entries = buildCombinedPhotoEntriesForm();
      targetUrl = photoUrl(currentPhotos[idx]);
    } else {
      const rec = state.detailRecord || {};
      entries = buildCombinedPhotoEntriesRecord(rec);
      targetUrl = photoUrl((rec.fotos||[])[idx]);
    }
    const startIdx = Math.max(0, entries.findIndex(en => en.url === targetUrl));
    openLightbox(entries, startIdx);
  }
  else if(action === 'view-photo-record-desvio'){
    const di = parseInt(el.dataset.di, 10);
    const rec = state.detailRecord || {};
    const entries = buildCombinedPhotoEntriesRecord(rec);
    const targetUrl = photoUrl((rec.desvios||[])[di] ? rec.desvios[di].foto : null);
    const startIdx = Math.max(0, entries.findIndex(en => en.url === targetUrl));
    openLightbox(entries, startIdx);
  }
  else if(action === 'add-units'){
    const ta = document.getElementById('add-textarea');
    const {valid, errors} = parseMasterInput(ta.value);
    const errBox = document.getElementById('add-errors');
    if(errors.length){
      errBox.innerHTML = `<div class="error-box"><b>${errors.length} línea(s) con problemas:</b><br>${errors.slice(0,15).map(x=>escapeHtml(x)).join('<br>')}</div>`;
    } else { errBox.innerHTML = ''; }
    if(valid.length === 0){ toast('No hay unidades válidas para agregar.'); return; }
    const dedup = {};
    state.masterList.forEach(u => dedup[u.id] = u);
    let addedCount = 0, updatedCount = 0;
    valid.forEach(u => { if(dedup[u.id]) updatedCount++; else addedCount++; dedup[u.id] = u; });
    const merged = Object.values(dedup).sort((a,b)=>a.id.localeCompare(b.id));
    try{
      await dbSetMaster(merged);
      state.masterList = merged;
      buildUnitsById();
      toast(`${addedCount} unidades nuevas${updatedCount? ', '+updatedCount+' actualizadas':''}.`);
      render();
    }catch(err){ toast('Error al guardar.'); }
  }
  else if(action === 'delete-relevamiento'){
    const id = state.detailId;
    if(!(await requestSecurityCode(`Para eliminar el relevamiento de la unidad ${id}, ingresá el código de seguridad:`))) return;
    try{
      await dbDeleteUnit(id);
      state.completedSet.delete(id);
      delete state.recordsCache[id];
      toast('Relevamiento eliminado. La unidad volvió a pendientes.');
      state.screen = 'dashboard';
      state.tab = 'pending';
      render();
    }catch(e){ toast('Error al eliminar. Probá de nuevo.'); }
  }
  else if(action === 'delete-unit'){
    const id = state.detailId;
    if(!(await requestSecurityCode(`Para eliminar la unidad ${id} de la flota, ingresá el código de seguridad:`))) return;
    try{
      const wasDone = state.completedSet.has(id);
      if(wasDone){
        try{ await dbDeleteUnit(id); }catch(e){}
      }
      const merged = state.masterList.filter(u => u.id !== id);
      await dbSetMaster(merged);
      state.masterList = merged;
      buildUnitsById();
      state.completedSet.delete(id);
      delete state.recordsCache[id];
      toast(`Unidad ${id} eliminada de la flota.`);
      state.screen = 'dashboard';
      state.tab = 'pending';
      render();
    }catch(e){ toast('Error al eliminar la unidad.'); }
  }
  else if(action === 'wipe'){
    if(!(await requestSecurityCode('Esto borra TODOS los relevamientos. Ingresá el código de seguridad para confirmar:'))) return;
    const keys = await dbListUnitIds();
    for(const k of keys){
      try{ await dbDeleteUnit(k); }catch(e){}
    }
    state.completedSet = new Set();
    state.recordsCache = {};
    toast('Relevamientos borrados.');
    render();
  }
});

initSecurityModal();
initLightbox();
loadAll();
</script>
